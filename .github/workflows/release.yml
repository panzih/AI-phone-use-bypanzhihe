# 打 tag 就出 Release。
#
# 触发：往远端推一个 v* 标签（git push origin v0.12.5，或 git push --follow-tags）。
#      推分支本身不会触发这里 —— Release 只跟标签走，普通 push 只跑 CI。
#
# 干的事：出一个正式签名包 → 挑更新说明 → 建 Release 并挂上 APK。
#
# 只发一个包：
#   *-official.apk  assembleRelease，正式密钥签名。
#
# 0.14.1 起不再发布 legacy（开发者 Debug 签名）包。历史 legacy 用户签名不同，
# 不能覆盖安装：需要先卸载旧版，再装正式签名包（本地数据会清空）。
#
# 更新说明从哪儿来（按优先级）：
#   1. docs/release-notes/<tag>.md      例如 docs/release-notes/v0.12.5.md
#   2. docs/release-notes/<版本>.md     例如 docs/release-notes/0.12.5.md
#   3. CHANGELOG.md 里 "## 0.12.5" 这一节（自动截取到下一个 ## 之前）
#   4. 标签自己的注释（git tag -a 的 -m 内容）
#   5. 都没有就让 GitHub 按提交自动生成
# 所以日常发版只要把 md 写好推进去就行，不用去网页上粘。
#
# ⚠️ 正式签名密钥从 Actions Secrets 还原，四个都要配，缺一个直接失败：
#     RELEASE_KEYSTORE_B64     base64 -i keystore/release.keystore | tr -d '\n'
#     RELEASE_STORE_PASSWORD   生成时打印的那个口令
#     RELEASE_KEY_ALIAS        别名
#     RELEASE_KEY_PASSWORD     口令
name: Release

on:
  push:
    tags: ['v*']

# 同一个标签重复推，只留最后一次
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  release:
    # 与 CI 保持一致，别让镜像漂移影响出包
    runs-on: ubuntu-24.04
    # 单个 variant，R8 和 lintVital 各跑一遍；留足余量
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 取全历史：生成说明和读 tag 注释都要用

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # 正式签名密钥只在 Secrets 里。少任何一个都直接失败 ——
      # 宁可不出包，也不要拿开发者签名冒充正式版。
      - name: 还原发布签名密钥
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
          STORE_PASS: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=""
          [ -n "${KEYSTORE_B64:-}" ] || missing="$missing RELEASE_KEYSTORE_B64"
          [ -n "${STORE_PASS:-}" ]   || missing="$missing RELEASE_STORE_PASSWORD"
          [ -n "${KEY_ALIAS:-}" ]    || missing="$missing RELEASE_KEY_ALIAS"
          [ -n "${KEY_PASS:-}" ]     || missing="$missing RELEASE_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error title=缺少发布签名密钥::未配置：$missing"
            exit 1
          fi
          mkdir -p keystore
          printf '%s' "$KEYSTORE_B64" | base64 -d > keystore/release.keystore
          chmod 600 keystore/release.keystore
          {
            echo "storeFile=keystore/release.keystore"
            echo "storePassword=$STORE_PASS"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASS"
          } > keystore.properties
          echo "已还原正式密钥，别名 $KEY_ALIAS"

      # 提醒：tag 和包里的 versionName 不一致时给个警告，避免"标签叫 0.12.5、
      # 装上去是 0.12.4"这种低级错
      - name: 检查版本号是否对得上
        run: |
          TAG="${GITHUB_REF_NAME}"
          VER="${TAG#v}"
          NAME=$(grep -o 'versionName = "[^"]*"' app/build.gradle.kts | head -n1 | sed 's/.*"\(.*\)"/\1/')
          echo "标签 ${TAG} / 工程 versionName ${NAME}"
          if [ "$VER" != "$NAME" ]; then
            echo "::warning title=版本号不一致::标签是 ${VER}，build.gradle.kts 里是 ${NAME}；确认无误再发"
          fi

      - name: 构建正式签名安装包
        run: ./gradlew :app:assembleRelease --stacktrace

      # 出包之后验一遍指纹：正式包必须**不是**仓库里那把公开的开发者密钥。
      # 是的话说明 Secrets 没生效，绝不能发出去。
      - name: 校验签名指纹
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          BUILD_TOOLS=$(ls -d "$SDK"/build-tools/* | sort -V | tail -n1)
          OFFICIAL=$(ls app/build/outputs/apk/release/*.apk | head -n1)

          digest() {
            "$BUILD_TOOLS/apksigner" verify --print-certs "$1" \
              | sed -n 's/.*certificate SHA-256 digest: //p' \
              | head -n1 | tr -d ':' | tr 'A-Z' 'a-z'
          }

          OFF=$(digest "$OFFICIAL")
          echo "official: $OFF"

          # 仓库里 keystore/debug.keystore 的证书指纹，私钥是公开的
          LEGACY_CERT=e2876ac3252f61067c74fc0d74bc60be47fb0c2a083c783c40295f0b4353903d

          if [ -z "$OFF" ]; then
            echo "::error title=正式包没签上::apksigner 读不出正式包的证书"
            exit 1
          fi
          if [ "$OFF" = "$LEGACY_CERT" ]; then
            echo "::error title=正式包用了开发者签名::指纹和仓库里的 debug.keystore 相同，说明 Secrets 没生效，不能发布"
            exit 1
          fi
          echo "指纹校验通过"

      # 选出这次要用的说明文件，写进 step output
      - name: 准备更新说明
        id: notes
        run: |
          set -e
          TAG="${GITHUB_REF_NAME}"
          VER="${TAG#v}"
          NOTES=""

          for f in "docs/release-notes/${TAG}.md" "docs/release-notes/${VER}.md"; do
            if [ -f "$f" ]; then NOTES="$f"; break; fi
          done

          if [ -z "$NOTES" ] && [ -f CHANGELOG.md ]; then
            awk -v ver="$VER" 'index($0, "## " ver) == 1 { on = 1; next } on && /^## / { exit } on { print }' CHANGELOG.md > /tmp/notes.md
            if [ -s /tmp/notes.md ]; then NOTES=/tmp/notes.md; fi
          fi

          if [ -z "$NOTES" ]; then
            git tag -l --format='%(contents)' "$TAG" > /tmp/notes.md 2>/dev/null || true
            if [ -s /tmp/notes.md ]; then NOTES=/tmp/notes.md; fi
          fi

          echo "path=$NOTES" >> "$GITHUB_OUTPUT"
          if [ -n "$NOTES" ]; then
            echo "说明来源：$NOTES"
            head -n 20 "$NOTES"
          else
            echo "没有现成说明，交给 GitHub 自动生成"
          fi

      - name: 创建 / 更新 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTES_PATH: ${{ steps.notes.outputs.path }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n1)

          # 附件名用 ASCII：GitHub 会把非 ASCII 字符清洗掉（实测
          # 「AI手机-v0.12.5.apk」变成了「AI.-v0.12.5.apk」）。
          # gh 的 `path#name` 写法在不同版本上也不都会改名，所以先复制成
          # 目标文件名再上传，附件名才稳定。
          STAGE="${RUNNER_TEMP}/AI-phone-${TAG}-official.apk"
          cp "$APK" "$STAGE"

          # 只有一个包，但签名线换过，旧用户不能覆盖安装的事实要写在最前面
          NOTES="${RUNNER_TEMP}/release-notes.md"
          cat > "$NOTES" <<'MD'
          ## 安装包

          本 Release 只提供一个**正式签名**的安装包。

          - 新用户：直接安装。
          - 还在用 0.13.0 及更早版本、或之前装过 `-legacy.apk` 的用户：
            签名不同，**不能覆盖安装**。需要先卸载旧版，再装这个包；
            卸载会清空本地设置、对话和记忆。
          - 从 0.14.1 起不再发布 legacy（开发者签名）包。
          MD
          printf '\n' >> "$NOTES"
          if [ -n "${NOTES_PATH:-}" ]; then
            cat "$NOTES_PATH" >> "$NOTES"
          else
            echo "本版说明未单独编写，改动见提交记录。" >> "$NOTES"
          fi

          PRE=""
          case "$TAG" in
            *-beta*|*-rc*|*-alpha*) PRE="--prerelease" ;;
          esac

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # 同一标签重复推：整套重建，避免旧附件（app-release.apk）和新附件并存。
            echo "该标签已有 Release，删除后按本次构建重建"
            gh release delete "$TAG" --yes --repo "$GITHUB_REPOSITORY"
          fi

          gh release create "$TAG" "$STAGE" \
            --title "$TAG" --notes-file "$NOTES" $PRE --repo "$GITHUB_REPOSITORY"

          echo "发布完成：https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
