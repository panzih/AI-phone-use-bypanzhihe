# 构建与测试护栏。
#
# 这个项目的正确性策略是"**决策纯函数靠单测钉住**、真机行为靠导出日志复盘"
# （见 RunGuards / ActionParser / WaitPolicy 的设计说明）。Tests 目录里已经
# 攒了十几个测试文件，但此前只能靠人肉跑 —— 这次把它变成 push / PR 的门。
#
# 这个 CI 跑三件事：JVM 单测、lintDebug、assembleDebug。
# 都不需要模拟器/真机，冷启动 5~8 分钟。
# instrumentation 测试（androidTest）需要设备，不在这里假装覆盖 ——
# 运行说明见 docs/testing-device.md。
name: CI

on:
  push:
    branches: [main]
  pull_request:

# 同一分支的旧运行没价值，新的来了就取消旧的
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    # 钉死 24.04：ubuntu-latest 2026-10-19 起迁 Ubuntu 26，镜像换代会悄悄改变
    # 单测环境（Robolectric 尤其敏感），这里不让它漂
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      # AGP 8.7 需要 JDK 17（build.gradle.kts 里 sourceCompatibility=17）
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # 带 Gradle 缓存；第二次起省掉依赖下载的几分钟
      - uses: gradle/actions/setup-gradle@v4

      # GitHub 的 ubuntu 镜像自带 Android SDK（ANDROID_HOME 已设好），
      # 所以不需要 local.properties，也不需要再装 SDK
      # --rerun-tasks --no-build-cache：setup-gradle 会把 ~/.gradle 的构建缓存一起
      # 带上，命中缓存时 test 任务直接 FROM-CACHE 秒过 —— 代码没测却显示绿。
      # 这道门要真跑，宁可多花两分钟。
      - name: 跑单测
        run: ./gradlew :app:testDebugUnitTest --rerun-tasks --no-build-cache --stacktrace

      # 红的时候不再只有一行 exit code 1：直接列出挂掉的用例名，
      # 日志和 Annotations 区都能看到，不用下载 artifact 才知道原因
      - name: 打印失败用例
        if: failure()
        run: python3 tools/print_failed_tests.py

      # lint error 直接挡住合并；warning 留在报告里，不阻塞
      - name: Lint
        run: ./gradlew :app:lintDebug --stacktrace

      # 编译不过的代码不应该进 main。release 签名方案确定前只构建 debug
      - name: 构建 Debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      # 失败时把报告传上来，省得让人本地复现
      - name: 上传测试报告
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: |
            app/build/reports/tests/testDebugUnitTest
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
