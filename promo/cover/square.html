<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>纸盒 · B站封面 4:3</title>
<style>
  @font-face { font-family: "Display"; src: url(../v3/fonts/SmileySans.ttf) format("truetype"); }
  @font-face { font-family: "Text";    src: url(../v3/fonts/WenKai.ttf)     format("truetype"); }
  html, body { margin: 0; background: #000; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script type="module">
// 首页 / 分区列表用的 4:3 封面 —— 这是缩略图最小的位置，字要占到最大
const W = 1600, H = 1200;
const c = document.getElementById('c');
c.width = W; c.height = H;
const ctx = c.getContext('2d');

window.DUR = 1;
window.render = () => {};

const C = {
  paper: '#F2EFE8',
  ink: '#171A18',
  dim: 'rgba(23,26,24,.56)',
  green: '#3E6B4A',
  greenSoft: 'rgba(62,107,74,.13)',
};
const F_DISP = s => `400 ${s}px "Display", "PingFang SC", sans-serif`;
const F_TEXT = s => `400 ${s}px "Text", "PingFang SC", serif`;

function rr(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function txt(s, x, y, font, color, align = 'left', sp = 0) {
  ctx.save();
  ctx.font = font; ctx.fillStyle = color; ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  if (sp) ctx.letterSpacing = sp + 'px';
  const w = ctx.measureText(s).width;
  let dx = x;
  if (align === 'center') dx = x - w / 2;
  if (align === 'right') dx = x - w;
  ctx.fillText(s, dx, y);
  ctx.restore();
  return w;
}

function logo(cx, cy, size, color, lw) {
  const s = size / 108;
  const P = (x, y) => [cx + (x - 54) * s, cy + (y - 54) * s];
  const out = [[20, 88], [20, 46], [46, 20], [88, 20], [88, 62], [62, 88], [20, 88]].map(p => P(...p));
  const inner = [[[20, 46], [62, 46]], [[62, 46], [62, 88]], [[62, 46], [88, 20]]].map(e => e.map(p => P(...p)));
  ctx.save();
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  ctx.strokeStyle = color; ctx.lineWidth = lw;
  ctx.beginPath(); ctx.moveTo(...out[0]);
  for (let i = 1; i < out.length; i++) ctx.lineTo(...out[i]);
  ctx.stroke();
  ctx.beginPath();
  for (const e of inner) { ctx.moveTo(...e[0]); ctx.lineTo(...e[1]); }
  ctx.stroke();
  ctx.restore();
}

const loadImage = src => new Promise((res, rej) => {
  const im = new Image();
  im.onload = () => res(im); im.onerror = () => rej(new Error(src));
  im.src = src;
});

(async () => {
  await Promise.all([
    document.fonts.load(F_DISP(80)), document.fonts.load(F_DISP(230)),
    document.fonts.load(F_TEXT(46)),
  ]);
  const calc = await loadImage('../v3/assets/shots/calc.png');

  ctx.fillStyle = C.paper;
  ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = 'rgba(23,26,24,.03)';
  ctx.lineWidth = 1;
  for (let y = 0; y < H; y += 56) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }

  logo(106, 118, 76, C.ink, 4.6);
  txt('纸盒', 160, 142, F_DISP(50), C.ink, 'left', 4);

  const ktag = 'AI手机';
  ctx.font = F_DISP(34);
  const ktw = ctx.measureText(ktag).width + 50;
  ctx.fillStyle = C.green;
  rr(292, 94, ktw, 60, 30);
  ctx.fill();
  txt(ktag, 292 + ktw / 2, 138, F_DISP(34), C.paper, 'center', 2);

  // 主文案：一行铺满，缩到 180px 宽也认得出
  const main = '我没碰屏幕';
  const MS = 226;
  ctx.font = F_DISP(MS);
  const total = ctx.measureText(main).width + 4 * 4;
  let x = (W - total) / 2;
  const baseY = 452;
  for (let i = 0; i < main.length; i++) x += txt(main[i], x, baseY, F_DISP(MS), i >= 3 ? C.green : C.ink) + 4;

  txt('只说了五个字：装个计算器', W / 2, 540, F_TEXT(46), C.dim, 'center', 1);

  const tag = '全程 0 次点击';
  ctx.font = F_TEXT(42);
  const tw = ctx.measureText(tag).width + 76;
  ctx.fillStyle = C.greenSoft;
  rr((W - tw) / 2, 574, tw, 78, 39);
  ctx.fill();
  txt(tag, W / 2, 628, F_TEXT(42), C.green, 'center', 1);

  // 手机从下方探上来，底部出血。
  // 只截计算器的按键区：整张屏原样放进来会有一大块白，缩到 180px 宽就什么信息都没有了。
  const SRC_Y = 880, SRC_H = 1460;
  const pw = 604, ph = pw * SRC_H / 1080;
  const px = (W - pw) / 2, py = 700;
  ctx.save();
  ctx.shadowColor = 'rgba(20,24,20,.22)';
  ctx.shadowBlur = 50; ctx.shadowOffsetY = 22;
  ctx.fillStyle = '#0d0f0e';
  rr(px - 10, py - 10, pw + 20, ph + 20, 46);
  ctx.fill();
  ctx.restore();

  ctx.save();
  rr(px, py, pw, ph, 37);
  ctx.clip();
  ctx.drawImage(calc, 0, SRC_Y, 1080, SRC_H, px, py, pw, ph);
  ctx.restore();

  ctx.save();
  ctx.strokeStyle = 'rgba(255,255,255,.18)';
  ctx.lineWidth = 2;
  rr(px + 1, py + 1, pw - 2, ph - 2, 36);
  ctx.stroke();
  ctx.restore();

  window.READY = true;
})().catch(e => { console.error(e); });
</script>
</body>
</html>
