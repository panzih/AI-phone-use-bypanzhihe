<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>纸盒 · 控件树封面 16:9</title>
<style>
  @font-face { font-family: "Display"; src: url(../fonts/SmileySans.ttf) format("truetype"); }
  @font-face { font-family: "Text";    src: url(../fonts/WenKai.ttf)     format("truetype"); }
  html, body { margin: 0; background: #000; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script type="module">
const W = 1920, H = 1080;
const c = document.getElementById('c');
c.width = W; c.height = H;
const ctx = c.getContext('2d');
window.DUR = 1;
window.render = () => {};

const C = { paper: '#F2EFE8', ink: '#171A18', dim: 'rgba(23,26,24,.55)',
            faint: 'rgba(23,26,24,.14)', green: '#3E6B4A', gray: '#A9A49A', grayInk: '#6F6A60' };
const F_DISP = s => `400 ${s}px "Display", "PingFang SC", sans-serif`;
const F_TEXT = s => `400 ${s}px "Text", "PingFang SC", serif`;

function rr(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function txt(s, x, y, font, color, align = 'left', sp = 0) {
  ctx.save();
  ctx.font = font; ctx.fillStyle = color; ctx.textBaseline = 'alphabetic';
  if (sp) ctx.letterSpacing = sp + 'px';
  const w = ctx.measureText(s).width;
  let dx = x;
  if (align === 'center') dx = x - w / 2;
  if (align === 'right') dx = x - w;
  ctx.fillText(s, dx, y);
  ctx.restore();
  return w;
}
function logo(cx, cy, size, color, lw) {
  const s = size / 108;
  const P = (x, y) => [cx + (x - 54) * s, cy + (y - 54) * s];
  const out = [[20, 88], [20, 46], [46, 20], [88, 20], [88, 62], [62, 88], [20, 88]].map(p => P(...p));
  const inner = [[[20, 46], [62, 46]], [[62, 46], [62, 88]], [[62, 46], [88, 20]]].map(e => e.map(p => P(...p)));
  ctx.save();
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  ctx.strokeStyle = color; ctx.lineWidth = lw;
  ctx.beginPath(); ctx.moveTo(...out[0]);
  for (let i = 1; i < out.length; i++) ctx.lineTo(...out[i]);
  ctx.stroke();
  ctx.beginPath();
  for (const e of inner) { ctx.moveTo(...e[0]); ctx.lineTo(...e[1]); }
  ctx.stroke();
  ctx.restore();
}

(async () => {
  await Promise.all([document.fonts.load(F_DISP(200)), document.fonts.load(F_TEXT(40))]);

  ctx.fillStyle = C.paper;
  ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = 'rgba(23,26,24,.028)';
  ctx.lineWidth = 1;
  for (let y = 0; y < H; y += 54) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }

  logo(150, 128, 72, C.ink, 4.6);
  txt('纸盒', 200, 152, F_DISP(48), C.ink, 'left', 4);
  const ktag = 'AI手机';
  ctx.font = F_DISP(34);
  const ktw = ctx.measureText(ktag).width + 50;
  ctx.fillStyle = C.green;
  rr(330, 100, ktw, 58, 29); ctx.fill();
  txt(ktag, 330 + ktw / 2, 142, F_DISP(34), C.paper, 'center', 2);

  txt('AI 不用看屏幕', 116, 352, F_DISP(112), C.ink, 'left', 4);
  txt('它读的是控件树', 112, 536, F_DISP(180), C.green, 'left', 8);

  ctx.fillStyle = C.faint;
  ctx.fillRect(116, 606, W - 232, 1.5);

  const baseY = 800;
  txt('一屏控件树 · 25 个元素', 116, 668, F_TEXT(40), C.green, 'left', 1);
  const w = txt('1', 112, baseY, F_DISP(170), C.green);
  txt('KB', 112 + w + 22, 784, F_DISP(68), C.green);
  txt('922 个字', 116, 880, F_TEXT(36), C.green, 'left', 1);

  txt('同一屏的截图', W - 116, 668, F_TEXT(40), C.grayInk, 'right', 1);
  ctx.font = F_DISP(170);
  const tW = ctx.measureText('689').width;
  txt('689', W - 116 - (tW + 22 + 46), baseY, F_DISP(170), C.grayInk);
  txt('KB', W - 116 - 46, 784, F_DISP(68), C.grayInk);
  txt('PNG 转 base64 之后', W - 116, 880, F_TEXT(36), C.grayInk, 'right', 1);

  // 同一刻度的两条比例尺
  const barY = 930, barH = 20, x0 = 116, maxW = W - 232;
  ctx.fillStyle = 'rgba(23,26,24,.06)';
  rr(x0, barY, maxW, barH, 10); ctx.fill();
  ctx.fillStyle = C.gray;
  rr(x0, barY, maxW, barH, 10); ctx.fill();
  ctx.fillStyle = C.green;
  rr(x0, barY - 8, 16, barH + 16, 4); ctx.fill();

  txt('数字取自模拟器实测：Android 设置页的控件树，与同一屏的截图', 116, 1012, F_TEXT(26), 'rgba(23,26,24,.34)', 'left', 1);

  window.READY = true;
})().catch(e => console.error(e));
</script>
</body>
</html>
