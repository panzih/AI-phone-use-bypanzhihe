<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>纸盒 · 控件树</title>
<style>
  @font-face { font-family: "Display"; src: url(fonts/SmileySans.ttf) format("truetype"); }
  @font-face { font-family: "Text";    src: url(fonts/WenKai.ttf)     format("truetype"); }
  html, body { margin: 0; background: #000; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script type="module" src="./preview.js"></script>
<script type="module">
import { DUR, CUES, SHOTS, b } from './timeline.js';
import { seg, lerp, ease, pulse, stageSize, setupCanvas, loadFonts } from './motion.js';

const { W, H } = stageSize();
const ctx = setupCanvas(document.getElementById('c'), W, H);
const U = H / 1080;

const C = {
  paper: '#F2EFE8',
  ink: '#171A18',
  dim: 'rgba(23,26,24,.52)',
  faint: 'rgba(23,26,24,.12)',
  green: '#3E6B4A',
  grayInk: '#6F6A60',
  red: '#B4472F',
};
const F_DISP = s => `400 ${s}px "Display", "PingFang SC", sans-serif`;
const F_TEXT = s => `400 ${s}px "Text", "PingFang SC", serif`;
const F_MONO = s => `400 ${s}px "SF Mono", "Menlo", monospace`;

const shot = id => SHOTS.find(s => s.id === id);
const hit = sfx => CUES.filter(c => c.sfx === sfx).map(c => c.t);

function txt(s, x, y, font, color, align = 'left', sp = 0) {
  ctx.save();
  ctx.font = font; ctx.fillStyle = color; ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  if (sp) ctx.letterSpacing = sp + 'px';
  const w = ctx.measureText(s).width;
  let dx = x;
  if (align === 'center') dx = x - w / 2;
  if (align === 'right') dx = x - w;
  ctx.fillText(s, dx, y);
  ctx.restore();
  return w;
}

function rr(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function logo(cx, cy, size, color, lw, prog = 1) {
  const s = size / 108;
  const P = (x, y) => [cx + (x - 54) * s, cy + (y - 54) * s];
  const out = [[20, 88], [20, 46], [46, 20], [88, 20], [88, 62], [62, 88], [20, 88]].map(p => P(...p));
  const inner = [[[20, 46], [62, 46]], [[62, 46], [62, 88]], [[62, 46], [88, 20]]].map(e => e.map(p => P(...p)));
  ctx.save();
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  ctx.strokeStyle = color; ctx.lineWidth = lw;
  const per = []; let total = 0;
  for (let i = 0; i < out.length - 1; i++) {
    const d = Math.hypot(out[i + 1][0] - out[i][0], out[i + 1][1] - out[i][1]);
    per.push(d); total += d;
  }
  let left = total * Math.min(1, Math.max(0, prog));
  ctx.beginPath(); ctx.moveTo(...out[0]);
  for (let i = 0; i < per.length && left > 0; i++) {
    const k = Math.min(1, left / per[i]);
    ctx.lineTo(lerp(out[i][0], out[i + 1][0], k), lerp(out[i][1], out[i + 1][1], k));
    left -= per[i];
  }
  ctx.stroke();
  if (prog > 0.98) {
    ctx.beginPath();
    for (const e of inner) { ctx.moveTo(...e[0]); ctx.lineTo(...e[1]); }
    ctx.stroke();
  }
  ctx.restore();
}

// 一串 base64 似的垃圾字符：固定种子，逐帧一致
const JUNK = (() => {
  const A = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/';
  let s = 20261117;
  let out = '';
  for (let i = 0; i < 4200; i++) {
    s = (s * 1103515245 + 12345) & 0x7fffffff;
    out += A[(s >> 16) % 64];
  }
  return out;
})();

const GRAIN = (() => {
  const c = document.createElement('canvas');
  c.width = c.height = 160;
  const g = c.getContext('2d');
  const d = g.createImageData(160, 160);
  let s = 20261117;
  for (let i = 0; i < d.data.length; i += 4) {
    s = (s * 1103515245 + 12345) & 0x7fffffff;
    const v = (s >> 16) & 255;
    d.data[i] = d.data[i + 1] = d.data[i + 2] = v;
    d.data[i + 3] = 15;
  }
  g.putImageData(d, 0, 0);
  return c;
})();

const loadImage = src => new Promise((res, rej) => {
  const im = new Image();
  im.onload = () => (im.decode ? im.decode().then(() => res(im), () => res(im)) : res(im));
  im.onerror = () => rej(new Error(src));
  im.src = src;
});

window.DUR = DUR;

(async () => {
  await loadFonts([
    F_DISP(46), F_DISP(62), F_DISP(74), F_DISP(76), F_DISP(86), F_DISP(92), F_DISP(96),
    F_DISP(112), F_DISP(150), F_DISP(170), F_DISP(200),
    F_TEXT(28), F_TEXT(32), F_TEXT(36), F_TEXT(40), F_TEXT(42), F_TEXT(58),
    F_MONO(19), F_MONO(30), F_MONO(34),
  ]);
  const S = { hook: shot('hook'), snap: shot('snap'), guess: shot('guess'),
              tree: shot('tree'), edge: shot('edge'), end: shot('end') };
  const flashT = [...hit('snap'), ...hit('impact')].sort((a, z) => a - z);
  // 先把截图缩一次存成离屏画布：逐帧 drawImage 同一份位图，
  // 避免大图在每帧解码/缩放时产生细微差异（会让确定性检查报错）
  const rawShot = await loadImage('assets/shots/inst.png');
  const shotCv = document.createElement('canvas');
  shotCv.width = 540; shotCv.height = 1200;
  shotCv.getContext('2d').drawImage(rawShot, 0, 0, 540, 1200);
  const shotImg = shotCv;

  window.render = t => {
    ctx.save();

    ctx.fillStyle = C.paper;
    ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = 'rgba(23,26,24,.028)';
    ctx.lineWidth = 1;
    for (let y = 0; y < H; y += 54 * U) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }

    const shotNow = SHOTS.find(s => t >= s.t0 && t < s.t1) || SHOTS[SHOTS.length - 1];
    const cam = 1 + 0.02 * ease.inOutCubic(seg(t, shotNow.t0, shotNow.t1));
    ctx.save();
    ctx.translate(W / 2, H / 2); ctx.scale(cam, cam); ctx.translate(-W / 2, -H / 2);

    // ================================================ 01 它看见了什么（0–4）
    if (t < S.snap.t0) {
      const a1 = ease.outCubic(seg(t, 0.04, 0.26));
      const a2 = ease.outCubic(seg(t, 0.34, 0.56));
      const a3 = ease.outCubic(seg(t, 0.80, 1.16));

      ctx.save();
      ctx.globalAlpha = a1;
      txt('AI 点一下屏幕', W / 2, 268, F_DISP(92), C.ink, 'center', 3);
      ctx.restore();

      ctx.save();
      ctx.globalAlpha = a2;
      txt('它看见了什么？', W / 2, 386, F_DISP(112), C.green, 'center', 4);
      ctx.restore();

      // 左下：一张真实截图
      const pw = 236, ph = pw * 2400 / 1080;
      const px = 268, py = 520;
      ctx.save();
      ctx.globalAlpha = a3;
      ctx.fillStyle = '#0d0f0e';
      rr(px - 8, py - 8, pw + 16, ph + 16, 30); ctx.fill();
      ctx.restore();

      ctx.save();
      ctx.globalAlpha = a3;
      rr(px, py, pw, ph, 24); ctx.clip();
      ctx.drawImage(shotImg, px, py, pw, ph);
      ctx.restore();

      // 右下：一段控件树文本（真实格式）
      ctx.save();
      ctx.globalAlpha = a3;
      const lines = [
        '[3] Button "继续" @(540,2175) [可点]',
        '[4] Image  ""     @(300,640)',
        '[5] Text   "安装" @(540,980)',
      ];
      let ly = 640;
      for (const ln of lines) {
        txt(ln, 900, ly, F_MONO(30), C.ink, 'left');
        ly += 52;
      }
      ctx.restore();

      // 中间的分隔与「还是」
      ctx.save();
      ctx.globalAlpha = a3 * 0.8;
      txt('还是', 742, 800, F_TEXT(40), C.dim, 'center', 3);
      ctx.restore();
    }

    // ================================================ 02 做法一：发截图（4–11）
    if (t >= S.snap.t0 && t < S.guess.t0) {
      const t0 = S.snap.t0;
      const a1 = ease.outCubic(seg(t, t0 + 0.04, t0 + 0.26));
      const grow = ease.inOutCubic(seg(t, t0 + 0.26, t0 + 1.55));

      ctx.save();
      ctx.globalAlpha = a1;
      txt('做法一 · 发一张截图', 120, 200, F_TEXT(42), C.dim, 'left', 2);
      ctx.fillStyle = C.faint;
      ctx.fillRect(120, 226, 1680, 1.5);
      ctx.restore();

      // 字符带：从左边一张小截图里"流"出来，一路流到画外
      const bandY = 330, bandH = 300;
      const x0 = 120;
      const maxW = W - 120;

      const pw = 132, ph = pw * 2400 / 1080;
      ctx.save();
      ctx.globalAlpha = a1;
      ctx.fillStyle = '#0d0f0e';
      rr(x0, bandY, pw + 12, ph + 12, 16); ctx.fill();
      ctx.restore();
      ctx.save();
      ctx.globalAlpha = a1;
      rr(x0 + 6, bandY + 6, pw, ph, 12); ctx.clip();
      ctx.drawImage(shotImg, x0 + 6, bandY + 6, pw, ph);
      ctx.restore();

      // 流出来的 base64
      const flowX = x0 + pw + 26;
      const flowW = Math.max(0, Math.min(maxW - flowX, (maxW - flowX) * grow + 40));
      ctx.save();
      ctx.globalAlpha = a1;
      ctx.beginPath();
      ctx.rect(flowX, bandY, flowW, bandH);
      ctx.clip();
      ctx.font = F_MONO(19);
      ctx.fillStyle = 'rgba(23,26,24,.44)';
      let i = 0;
      for (let y = bandY + 26; y < bandY + bandH && i < JUNK.length - 120; y += 28) {
        ctx.fillText(JUNK.slice(i, i + 120), flowX, y);
        i += 120;
      }
      const grad = ctx.createLinearGradient(flowX + flowW - 160, 0, flowX + flowW, 0);
      grad.addColorStop(0, 'rgba(242,239,232,0)');
      grad.addColorStop(1, 'rgba(242,239,232,1)');
      ctx.fillStyle = grad;
      ctx.fillRect(flowX + flowW - 160, bandY, 160, bandH);
      ctx.restore();

      // 数字
      const a2 = ease.outCubic(seg(t, t0 + 1.05, t0 + 1.55));
      ctx.save();
      ctx.globalAlpha = a2;
      txt('一张', 120, 776, F_TEXT(40), C.dim, 'left', 1);
      const w = txt('689', 112, 916, F_DISP(150), C.ink);
      txt('KB', 112 + w + 20, 914, F_DISP(62), C.ink);
      txt('（深色安装器那张）', 120, 980, F_TEXT(28), C.dim, 'left', 1);

      txt('三十步', W - 120, 776, F_TEXT(40), C.dim, 'right', 1);
      ctx.font = F_DISP(150);
      const nW = ctx.measureText('6–20').width;
      const uW = 58;
      txt('6–20', W - 120 - (nW + 18 + uW), 916, F_DISP(150), C.ink);
      txt('MB', W - 120 - uW + 4, 916, F_DISP(58), C.ink);
      txt('（按实测单张算）', W - 120, 980, F_TEXT(28), C.dim, 'right', 1);
      ctx.restore();
    }

    // ================================================ 03 猜坐标（11–16）
    if (t >= S.guess.t0 && t < S.tree.t0) {
      const t0 = S.guess.t0;
      const a1 = ease.outCubic(seg(t, t0 + 0.04, t0 + 0.26));
      const a2 = ease.outCubic(seg(t, t0 + 0.32, t0 + 0.56));
      const a3 = ease.outCubic(seg(t, t0 + 1.45, t0 + 1.80));

      ctx.save();
      ctx.globalAlpha = a1;
      txt('可模型得自己看出：按钮在哪', 120, 226, F_DISP(74), C.ink, 'left', 2);
      ctx.restore();

      // 只裁 INSTALL 那一个按钮
      const SR = { x: 768, y: 1255, w: 252, h: 190 };
      const dw = 640, dh = dw * SR.h / SR.w;
      const dx = 640, dy = 320;
      ctx.save();
      ctx.globalAlpha = a1;
      ctx.fillStyle = '#0d0f0e';
      rr(dx - 8, dy - 8, dw + 16, dh + 16, 20); ctx.fill();
      ctx.restore();
      ctx.save();
      ctx.globalAlpha = a1;
      rr(dx, dy, dw, dh, 14); ctx.clip();
      ctx.drawImage(shotImg, SR.x, SR.y, SR.w, SR.h, dx, dy, dw, dh);
      ctx.restore();

      // 真实可点区域
      const k = dw / SR.w;
      const bx = dx + (790 - SR.x) * k, by = dy + (1290 - SR.y) * k;
      const bw = (990 - 790) * k, bh = (1400 - 1290) * k;
      ctx.save();
      ctx.globalAlpha = a2;
      ctx.strokeStyle = C.green;
      ctx.lineWidth = 3.5;
      ctx.setLineDash([11, 8]);
      rr(bx, by, bw, bh, 10); ctx.stroke();
      ctx.setLineDash([]);
      txt('按钮真实位置', bx - 2, by - 22, F_TEXT(28), C.green, 'left', 1);
      ctx.restore();

      // 模型"猜"出来的点：框外
      const gx = bx + bw * 0.55, gy = by + bh + 52;
      const pop = ease.outCubic(seg(t, t0 + 0.80, t0 + 1.06));
      ctx.save();
      ctx.globalAlpha = pop;
      ctx.fillStyle = C.red;
      ctx.beginPath(); ctx.arc(gx, gy, 14, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = pop * 0.3;
      ctx.strokeStyle = C.red; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(gx, gy, 30 + 22 * (1 - pop), 0, Math.PI * 2); ctx.stroke();
      ctx.restore();

      ctx.save();
      ctx.globalAlpha = a3;
      txt('猜偏 20 px，就点到空白', 120, 900, F_DISP(62), C.red, 'left', 2);
      txt('图上没有编号，模型只能"看着像"', 120, 966, F_TEXT(32), C.dim, 'left', 1);
      ctx.restore();
    }

    // ================================================ 04 做法二：控件树（16–23）
    if (t >= S.tree.t0 && t < S.edge.t0) {
      const t0 = S.tree.t0;
      const a0 = ease.outCubic(seg(t, t0 + 0.06, t0 + 0.4));

      ctx.save();
      ctx.globalAlpha = a0;
      txt('做法二 · 发一屏控件树', 120, 200, F_TEXT(42), C.dim, 'left', 2);
      ctx.fillStyle = C.faint;
      ctx.fillRect(120, 226, 1680, 1.5);
      ctx.restore();

      // 真实 dump 出来的行，逐行落下
      const LINES = [
        '[1] 文本 "Settings" @(235,472)',
        '[2] ViewGroup "" @(540,667) [可点]',
        '[3] 文本 "Search settings" @(376,667)',
        '[7] 文本 "Network & internet" @(540,712) [可点]',
        '[8] 文本 "Mobile, Wi-Fi, hotspot" @(540,780)',
      ];
      let y = 330;
      for (let i = 0; i < LINES.length; i++) {
        const ti = t0 + 0.18 + i * 0.24;
        const p = ease.outCubic(seg(t, ti, ti + 0.34));
        ctx.save();
        ctx.globalAlpha = p;
        ctx.translate(0, (1 - p) * 22);
        txt(LINES[i], 130, y, F_MONO(34), i === 3 ? C.ink : 'rgba(23,26,24,.62)');
        ctx.restore();
        y += 62;
      }

      // 编号可以直接回传
      const a2 = ease.outCubic(seg(t, t0 + 1.48, t0 + 1.82));
      ctx.save();
      ctx.globalAlpha = a2;
      const bx = 130, by = 700;
      ctx.fillStyle = 'rgba(62,107,74,.12)';
      rr(bx - 14, by - 44, 700, 72, 36); ctx.fill();
      txt('点 [7]', bx + 12, by + 2, F_DISP(46), C.green, 'left', 2);
      txt('→ 不用描述"那个蓝的"', bx + 196, by - 2, F_TEXT(30), C.dim, 'left', 1);
      ctx.restore();

      // 右侧数字：1 KB vs 689 KB
      const a3 = ease.outCubic(seg(t, t0 + 0.80, t0 + 1.24));
      ctx.save();
      ctx.globalAlpha = a3;
      txt('一屏 25 个元素', W - 120, 560, F_TEXT(36), C.dim, 'right', 1);
      ctx.font = F_DISP(170);
      const nW = ctx.measureText('922').width;
      txt('922', W - 120 - (nW + 18 + 60), 720, F_DISP(170), C.green);
      txt('字', W - 120 - 60 + 6, 720, F_DISP(64), C.green);
      txt('≈ 1 KB', W - 120, 800, F_DISP(56), C.dim, 'right', 2);
      ctx.restore();

      const a4 = ease.outCubic(seg(t, t0 + 1.80, t0 + 2.14));
      ctx.save();
      ctx.globalAlpha = a4;
      txt('同一屏截图 689 KB', W - 120, 858, F_TEXT(32), C.grayInk, 'right', 1);
      ctx.restore();

      const a5 = ease.outCubic(seg(t, t0 + 2.16, t0 + 2.5));
      ctx.save();
      ctx.globalAlpha = a5;
      txt('三十步 30 KB', W - 120, 936, F_DISP(48), C.green, 'right', 1);
      txt('截图要 6–20 MB', W - 120, 992, F_TEXT(32), C.dim, 'right', 1);
      ctx.restore();
    }

    // ================================================ 05 说不清的屏（23–26）
    if (t >= S.edge.t0 && t < S.end.t0) {
      const t0 = S.edge.t0;
      const a1 = ease.outCubic(seg(t, t0 + 0.04, t0 + 0.24));
      const a2 = ease.outCubic(seg(t, t0 + 0.24, t0 + 0.46));
      const a3 = ease.outCubic(seg(t, t0 + 0.70, t0 + 0.98));

      ctx.save();
      ctx.globalAlpha = a1;
      txt('说不清的屏，它才要一张图', W / 2, 400, F_DISP(86), C.ink, 'center', 3);
      ctx.restore();

      // 控件树读不到时会返回的那行原文
      ctx.save();
      ctx.globalAlpha = a2;
      const s1 = '（当前界面没有可交互元素，可能是游戏、视频或自定义绘制的页面）';
      ctx.font = F_MONO(30);
      const w1 = ctx.measureText(s1).width;
      ctx.fillStyle = 'rgba(23,26,24,.05)';
      rr(W / 2 - w1 / 2 - 34, 496, w1 + 68, 76, 38); ctx.fill();
      txt(s1, W / 2, 545, F_MONO(30), C.grayInk, 'center');
      ctx.restore();

      ctx.save();
      ctx.globalAlpha = a3;
      txt('这时候才发图，而且要它自己开口要', W / 2, 690, F_TEXT(36), C.dim, 'center', 2);
      ctx.restore();
    }

    // ================================================ 06 收尾（26–28）
    if (t >= S.end.t0) {
      const t0 = S.end.t0;
      const a0 = ease.outCubic(seg(t, t0, t0 + 0.20));

      const L = 200 * U, wordSize = 138 * U;
      ctx.save();
      ctx.font = F_DISP(wordSize);
      const ww = ctx.measureText('纸盒').width + 10 * U;
      ctx.restore();
      const gap = 42 * U;
      const left = W / 2 - (L + gap + ww) / 2;
      const midY = 430 * U;

      ctx.save();
      ctx.globalAlpha = a0;
      logo(left + L / 2, midY, L, C.ink, 5 * U, ease.outCubic(seg(t, t0 + 0.02, t0 + 0.46)));
      txt('纸盒', left + L + gap, midY + wordSize * 0.36, F_DISP(wordSize), C.ink, 'left', 6);
      ctx.restore();

      ctx.save();
      ctx.globalAlpha = ease.outCubic(seg(t, t0 + 0.28, t0 + 0.58));
      txt('不是省那点流量', W / 2, 620 * U, F_TEXT(58 * U), C.dim, 'center', 3);
      ctx.restore();

      ctx.save();
      ctx.globalAlpha = ease.outCubic(seg(t, t0 + 0.50, t0 + 0.80));
      txt('是别让它去猜', W / 2, 726 * U, F_DISP(96 * U), C.green, 'center', 4);
      ctx.restore();
    }

    ctx.restore();   // 结束缓推

    let fl = 0;
    for (const h of flashT) fl = Math.max(fl, pulse(t, h, 0.07, 0.006) * 0.13);
    if (fl > 0.004) {
      ctx.save(); ctx.globalAlpha = fl; ctx.fillStyle = '#fff';
      ctx.fillRect(0, 0, W, H); ctx.restore();
    }

    ctx.save();
    ctx.globalAlpha = 0.45;
    ctx.fillStyle = 'rgba(23,26,24,.10)';
    ctx.fillRect(0, H - 5 * U, W, 5 * U);
    ctx.fillStyle = C.green;
    ctx.fillRect(0, H - 5 * U, W * Math.min(1, t / DUR), 5 * U);
    ctx.restore();

    ctx.save();
    ctx.globalAlpha = 0.5;
    ctx.fillStyle = ctx.createPattern(GRAIN, 'repeat');
    ctx.fillRect(0, 0, W, H);
    ctx.restore();

    ctx.restore();
  };

  window.READY = true;
})().catch(e => { console.error('启动失败：', e); });
</script>
</body>
</html>
