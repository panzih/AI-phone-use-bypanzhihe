# JVM 参数
org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8

# ============================================================
# ⚠️ Gradle 用的 JDK 必须是 17 ~ 22，不能用 25
# ============================================================
#
# 症状：Android Studio 里构建直接失败，报错只有一行，看不出原因：
#
#     * What went wrong:
#     25.0.3
#     java.lang.IllegalArgumentException: 25.0.3
#         at com.intellij.util.lang.JavaVersion.parse(...)
#
# 原因：Gradle 8.9 自带的 Kotlin DSL 脚本编译器**不认识 JDK 25 的版本号**，
# 在解析 "25.0.3" 时就抛异常了（所以报错里只有那个数字）。
#
# 这条踩过的具体经过：Android Studio 2026.1.4 自带的 JBR 是 25，而命令行
# 用的 JBR 21 —— 于是"命令行能编译、IDE 里不能"，非常迷惑。
#
# 解决（改 IDE 设置，不用改这个文件）：
#   Settings → Build, Execution, Deployment → Build Tools → Gradle
#   → Gradle JDK → 选 17 或 21（本机有 jbr-21.0.11）
#
# 为什么不在这里写死 java.home：那是本机绝对路径，提交上去会污染别人的机器。
# 如果你确实想在这里指定，用 org.gradle.java.home=<路径>，但**别提交**。

# Kotlin 编译策略：in-process（不用独立的 Kotlin 守护进程）
#
# 为什么必须这么设：本项目路径里有中文（/Users/panzhihe/DSH/AI手机）。
# Kotlin 守护进程起不来时，Gradle 会回退到"无守护进程"模式，
# 而那个模式在拼插件 classpath 时会把中文路径转义坏掉 ——
# 报错长这样：
#     plugin classpath entry points to a non-existent location:
#     /Users/panzhihe/DSH/AIu624Bu673Au673A/...
# 注意 "AI手机" 变成了 "AIu624Bu673Au673A"（\u624B\u673A 被吞掉了反斜杠）。
# 路径不存在，编译必然失败，而且报错完全看不出真正原因。
#
# in-process 让编译器直接跑在 Gradle 守护进程里，不走那条会坏掉的路径。
# 代价是要多给点堆内存（上面从 2G 提到了 3G）。
kotlin.compiler.execution.strategy=in-process

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin
kotlin.code.style=official

# 国内网络环境下的容错设置
# 官方 Gradle 分发站国内连不上，所以 wrapper 里换成了腾讯云镜像。
# 下面这些能减少下载超时导致的失败。
systemProp.org.gradle.internal.http.connectionTimeout=120000
systemProp.org.gradle.internal.http.socketTimeout=120000
systemProp.org.gradle.internal.repository.max.retries=10
systemProp.org.gradle.internal.repository.initial.backoff=500

# 构建缓存，第二次编译快很多
org.gradle.caching=true
org.gradle.parallel=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
